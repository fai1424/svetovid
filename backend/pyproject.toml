[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svetovid"
version = "0.1.0"
description = "Svetovid — agentic DFIR desktop app backend (FastAPI + LangGraph)"
# README lives one dir up; don't reference it from pyproject (setuptools sandbox rejects ../).
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Svetovid contributors" }]

dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # LLM / agent
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",   # OpenAI-compatible → Ollama / GLM / KIMI via base_url

    # Forensic libs (native, used directly)
    "python-magic>=0.4.27",    # artifact sniffing; on macOS also `brew install libmagic`
    "docker>=7",               # sandbox runner

    # Storage / config
    "keyring>=25",             # OS keyring for API keys
    "aiosqlite>=0.20",         # case DB
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",             # for FastAPI TestClient
    "ruff>=0.6",
]

[project.scripts]
svetovid-backend = "svetovid.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["svetovid*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
