[package]
name = "svetovid"
version = "0.1.0"
description = "Svetovid — agentic DFIR desktop app"
authors = ["Svetovid contributors"]
license = "MIT"
repository = ""
default-run = "svetovid"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

# devtools stays enabled in debug; tauri strips it in release builds automatically.
[features]
custom-protocol = ["tauri/custom-protocol"]
